# inshinlab.com — сайт с ботом в ПОДПАПКЕ /Yasno-growth-bot/
# Корень домена не занят (под будущий лендинг).
#
# Установка:
#   cp deploy/nginx-site.conf /etc/nginx/sites-available/inshinlab.com
#   ln -sf /etc/nginx/sites-available/inshinlab.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# HTTPS добавит certbot (см. deploy/README.md) — он сам допишет 443-блок.

server {
    listen 80;
    listen [::]:80;
    server_name inshinlab.com www.inshinlab.com;

    # ── Корень домена: заглушка под будущий лендинг (НЕ трогаем) ──
    root /var/www/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # ── Ясно • AI-Академия: мини-апп + API ──
    location = /Yasno-growth-bot { return 301 /Yasno-growth-bot/; }

    location /Yasno-growth-bot/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # LLM-ответы бывают долгими
        proxy_buffering off;
        client_max_body_size 1m;
    }

    # Безопасные заголовки для мини-аппа
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
